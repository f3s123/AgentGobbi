<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시뮬레이션 · 에이전트고삐</title>
<link rel="stylesheet" href="/static/app.css?v=20260904">
</head>
<body>

<header class="topbar">
  <div class="brand">Agent고삐 <small>AI에게 맡기되, 통제는 내가.</small></div>
  <nav class="nav">
    <a id="nav-policy" href="/index.html">위임정책</a>
    <a id="nav-sim" href="/simulate.html">시뮬레이션</a>
    <a id="nav-result" href="/result.html">결과</a>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>AI Agent의 거래 시나리오를 시뮬레이션합니다</h1>
    <p>실제 금융 AI Agent 대신, Agent가 보낼 법한 거래 요청 시퀀스를 흘려보내
       에이전트고삐가 어느 시점에 권한을 조정하는지 확인합니다.
       시나리오를 하나 고르고 시뮬레이션을 시작하세요.</p>
  </div>

  <div class="panel" style="margin-bottom:18px">
    <h2 class="panel-title">적용 중인 위임정책</h2>
    <div id="policy-line" class="muted small">불러오는 중…</div>
  </div>

  <div class="panel">
    <h2 class="panel-title"> 시나리오 선택</h2>
    <div class="scn-grid" id="scn-grid"></div>
  </div>

  <div class="panel">
    <h2 class="panel-title"> 시뮬레이션 시작</h2>
    <div id="picked" class="muted small" style="margin:-6px 0 14px">
      아직 선택된 시나리오가 없습니다.
    </div>
    <div class="btn-row">
      <button class="btn primary lg" id="btn-run" disabled>시뮬레이션 시작</button>
    </div>
    <div id="run-msg" style="margin-top:14px"></div>
  </div>
</main>

<script src="/static/app.js"></script>
<script src="/static/simulate.js"></script>
</body>
</html>
