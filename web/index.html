<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위임정책 설정 · 에이전트고삐</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">에이전트고삐 <small>AI에게 맡기되, 통제는 내가.</small></div>
  <nav class="nav">
    <a id="nav-policy" href="/index.html">위임정책</a>
    <a id="nav-sim" href="/simulate.html">시뮬레이션</a>
    <a id="nav-result" href="/result.html">결과</a>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>AI Agent에게 무엇을, 어디까지 맡길지 정하세요</h1>
    <p>평소 말하듯 적어 주시면 생성형 AI가 시스템이 처리할 수 있는 위임정책으로 바꿔 드립니다.
       변환 결과를 직접 확인하신 뒤 승인하셔야 정책이 적용됩니다.</p>
  </div>

  <div class="panel">
    <h2 class="panel-title"><span class="num">1</span> 자연어로 위임 조건 입력</h2>
    <textarea id="input" rows="4" placeholder="예) 기존 거래처에는 50만원까지 알아서 보내고, 처음 보는 계좌면 나한테 물어봐."></textarea>
    <div class="chips" id="examples"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn primary" id="btn-compile">정책으로 변환</button>
      <span class="tagline" id="llm-mode"></span>
    </div>
    <div id="compile-err" style="margin-top:14px"></div>
  </div>

  <div class="panel" id="preview" style="display:none">
    <h2 class="panel-title"><span class="num">2</span> 변환 결과 확인</h2>
    <p class="muted small" id="summary" style="margin:-6px 0 16px"></p>
    <div class="policy-list" id="policy-rows"></div>
    <div id="assumptions" style="margin-top:14px"></div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" id="btn-approve">이 내용으로 승인</button>
      <button class="btn" id="btn-cancel">다시 작성</button>
    </div>
  </div>

  <div class="panel" id="active">
    <h2 class="panel-title"><span class="num">3</span> 현재 적용 중인 위임정책</h2>
    <div id="active-body"></div>
  </div>
</main>

<script src="/static/app.js"></script>
<script>
markNav('nav-policy');

const EXAMPLES = [
  '기존 거래처에는 50만원까지 알아서 보내고, 처음 보는 계좌면 나한테 물어봐.',
  '건당 30만원까지만 자동으로 결제하고, 하루 100만원 넘으면 확인해줘.',
  '해외송금이랑 상품권 결제는 절대 하지 마. 나머지는 20만원까지 알아서 해.',
  '밤에는 아무것도 하지 말고, 낮에만 40만원까지 자동으로 보내줘. 2주만 맡길게.'
];

let pending = null;

document.getElementById('examples').innerHTML =
  EXAMPLES.map((e, i) => `<button class="chip" data-i="${i}">${esc(e)}</button>`).join('');
document.getElementById('examples').addEventListener('click', ev => {
  const b = ev.target.closest('.chip');
  if (b) document.getElementById('input').value = EXAMPLES[+b.dataset.i];
});

async function loadStatus() {
  try {
    const h = await API.get('/api/health');
    document.getElementById('llm-mode').textContent =
      h.llm.enabled ? ('생성형 AI: ' + h.llm.model) : '생성형 AI: 규칙 기반 모드 (API 키 미설정)';
  } catch (e) { /* 무시 */ }
}

async function loadActive() {
  const el = document.getElementById('active-body');
  try {
    const r = await API.get('/api/policy');
    const src = r.policy.source === 'default'
      ? '<div class="notice" style="margin-bottom:14px">아직 정책을 승인하지 않으셨습니다. 아래는 기본값입니다.</div>' : '';
    const input = r.policy.input_text
      ? `<p class="muted small" style="margin:0 0 14px">입력하신 문장: “${esc(r.policy.input_text)}”</p>` : '';
    el.innerHTML = src + input + `<div class="policy-list">${policyRows(r.display)}</div>`;
  } catch (e) {
    el.innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  }
}

document.getElementById('btn-compile').addEventListener('click', async () => {
  const text = document.getElementById('input').value.trim();
  const errEl = document.getElementById('compile-err');
  errEl.innerHTML = '';
  if (!text) { errEl.innerHTML = '<div class="notice err">위임 조건을 입력해 주세요.</div>'; return; }

  const btn = document.getElementById('btn-compile');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 변환 중';
  try {
    const r = await API.post('/api/policy/compile', { text });
    pending = r.policy;
    document.getElementById('summary').textContent = r.policy.summary_ko;
    document.getElementById('policy-rows').innerHTML = policyRows(r.display);
    document.getElementById('assumptions').innerHTML = (r.policy.assumptions || []).length
      ? `<div class="notice"><b>말씀하지 않으신 부분은 이렇게 채웠습니다</b>
           <ul>${r.policy.assumptions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`
      : '';
    document.getElementById('preview').style.display = '';
    document.getElementById('preview').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) {
    errEl.innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '정책으로 변환';
  }
});

document.getElementById('btn-approve').addEventListener('click', async () => {
  if (!pending) return;
  const btn = document.getElementById('btn-approve');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 승인 중';
  try {
    await API.post('/api/policy/approve', { policy: pending });
    document.getElementById('preview').style.display = 'none';
    document.getElementById('input').value = '';
    pending = null;
    await loadActive();
    document.getElementById('compile-err').innerHTML =
      '<div class="notice ok">위임정책을 승인했습니다. 시뮬레이션 화면에서 AI Agent의 행동을 검증해 보세요.</div>';
  } catch (e) {
    document.getElementById('compile-err').innerHTML = `<div class="notice err">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '이 내용으로 승인';
  }
});

document.getElementById('btn-cancel').addEventListener('click', () => {
  document.getElementById('preview').style.display = 'none';
  pending = null;
});

loadStatus();
loadActive();
</script>
</body>
</html>
