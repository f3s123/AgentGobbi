<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위임정책 설정 · 에이전트고삐</title>
<link rel="stylesheet" href="/static/app.css?v=20260904">
</head>
<body>

<header class="topbar">
  <div class="brand">Agent고삐 <small>AI에게 맡기되, 통제는 내가.</small></div>
  <nav class="nav">
    <a id="nav-policy" href="/index.html">위임정책</a>
    <a id="nav-sim" href="/simulate.html">시뮬레이션</a>
    <a id="nav-result" href="/result.html">결과</a>
  </nav>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>AI Agent에게 무엇을, 어디까지 맡길지 정하세요</h1>
    <p>AI Agent에게 맡길 범위와 조건을 입력해주세요.
      변환된 정책을 확인·수정한 뒤 승인하면 적용됩니다.</p>
  </div>

  <div class="panel">
    <h2 class="panel-title"> 위임 정책 설정</h2>
    <textarea id="input" rows="4" placeholder="위임 정책을 입력하세요.&#10;※허용 시간대 설정시 정확한 시간을 입력해주세요."></textarea>
    <div class="chips" id="examples"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn primary" id="btn-compile">정책 변환</button>
    </div>
    <div id="compile-err" style="margin-top:14px"></div>
  </div>

  <div class="panel" id="preview" style="display:none">
    <h2 class="panel-title"> 위임 정책 확인</h2>
    <p class="muted small" id="summary" style="margin:-6px 0 16px"></p>
    <div class="policy-list" id="policy-rows"></div>
    <div id="assumptions" style="margin-top:14px"></div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn" id="btn-toggle-edit">세부 항목 수정</button>
      <button class="btn primary" id="btn-approve">이 내용으로 승인</button>
    </div>
  </div>

  <div class="panel" id="active">
    <h2 class="panel-title"> 현재 적용 중인 위임 정책</h2>
    <div id="active-body"></div>
  </div>
</main>

<script src="/static/app.js"></script>
<script src="/static/index.js?v=20260906"></script>
</body>
</html>
