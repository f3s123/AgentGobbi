name: Security and regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gobbi
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: gobbi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest==9.1.1 pip-audit==2.10.1 cfn-lint==1.56.0 playwright==1.62.0
      - run: python -m pytest tests -q
      - run: python -m pytest tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gobbi:ephemeral-ci-password@127.0.0.1:5432/gobbi_test
      - run: python verify.py
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
      - run: cfn-lint deploy/aws.yaml
      - run: for file in web/static/*.js; do node --check "$file"; done
      - run: playwright install --with-deps chromium
      - run: python tools/browser_smoke.py
      - run: docker build -t gobbi-security-test .
