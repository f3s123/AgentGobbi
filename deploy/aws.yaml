AWSTemplateFormatVersion: '2010-09-09'
Description: AgentGobbi private Fargate service behind HTTPS ALB. Existing VPC, RDS and secrets required.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  AppOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  AllowedClientCidr:
    Type: String
    Description: CIDR allowed to open the login-free web service; do not use 0.0.0.0/0
    AllowedPattern: '(?!0\.0\.0\.0/0$)[0-9./]+'
  CertificateArn:
    Type: String
  ImageUri:
    Type: String
    Description: Private ECR image pinned to sha256 digest
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager plain string DATABASE_URL; verify-full TLS and sslrootcert required
  AgentSecretArn:
    Type: String
    Description: Secrets Manager plain string AGENT_API_KEY (at least 32 characters)
  LlmSecretArn:
    Type: String
    Description: Secrets Manager plain string Google API key
  LlmModel:
    Type: String
    Default: ''
  EnableLlm:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  TrustedProxyCidrs:
    Type: String
    Description: Comma-separated ALB subnet CIDRs, never '*'
    AllowedPattern: '[0-9./,]+'
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  AlertEmail:
    Type: String
Conditions:
  UseLlm: !Equals [!Ref EnableLlm, 'true']
Resources:
  AlbGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedClientCidr}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedClientCidr}
  AppGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App traffic only from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbGroup
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref AlbGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: idle_timeout.timeout_seconds, Value: '60'}
  Target:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Target}]
  HttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  Cluster:
    Type: AWS::ECS::Cluster
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 90
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadAppSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecretArn
                  - !Ref AgentSecretArn
                  - !If [UseLlm, !Ref LlmSecretArn, !Ref AWS::NoValue]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          User: '10001'
          PortMappings: [{ContainerPort: 8000}]
          Environment:
            - {Name: APP_ENV, Value: production}
            - {Name: APP_ORIGIN, Value: !Ref AppOrigin}
            - {Name: FORWARDED_ALLOW_IPS, Value: !Ref TrustedProxyCidrs}
            - {Name: LLM_MODEL, Value: !If [UseLlm, !Ref LlmModel, '']}
          Secrets:
            - {Name: DATABASE_URL, ValueFrom: !Ref DatabaseSecretArn}
            - {Name: AGENT_API_KEY, ValueFrom: !Ref AgentSecretArn}
            - !If
              - UseLlm
              - {Name: GOOGLE_API_KEY, ValueFrom: !Ref LlmSecretArn}
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      LaunchType: FARGATE
      DesiredCount: 2
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnets
          SecurityGroups: [!Ref AppGroup]
      LoadBalancers:
        - {ContainerName: app, ContainerPort: 8000, TargetGroupArn: !Ref Target}
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]
  Errors:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '{ $.status >= 500 }'
      MetricTransformations:
        - {MetricNamespace: AgentGobbi, MetricName: ServerErrors, MetricValue: '1', DefaultValue: 0}
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AgentGobbi
      MetricName: ServerErrors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
Outputs:
  LoadBalancerDns: {Value: !GetAtt LoadBalancer.DNSName}
  AppSecurityGroup: {Value: !Ref AppGroup}
  ClusterName: {Value: !Ref Cluster}
